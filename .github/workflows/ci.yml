# Vérification rapide à chaque push et pull request (aucun paquet, aucune release) :
# tests + clippy sous Linux, compilation vérifiée pour macOS, et **tests réels sous
# Windows** : la compilation croisée depuis Linux cible windows-gnu alors que les
# paquets publiés sont en MSVC, et aucun code `cfg(windows)` n'y était exécuté.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-gnu,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libxkbcommon-dev libwayland-dev
      - name: Tests
        run: cargo test
      - name: Clippy (aucun avertissement toléré)
        run: cargo clippy --all-targets -- -D warnings
      - name: Compile pour Windows
        run: cargo check --target x86_64-pc-windows-gnu
      - name: Compile pour macOS
        run: cargo check --target x86_64-apple-darwin

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tests (MSVC)
        run: cargo test
      - name: Clippy (aucun avertissement toléré)
        run: cargo clippy --all-targets -- -D warnings
