[package]
name = "novaterm"
version = "0.0.2"
edition = "2021"
description = "Terminal moderne : onglets, splits, suggestions, blocs de commandes, images, thèmes"
license = "MIT"

[dependencies]
eframe = { version = "=0.31.1", features = ["__screenshot"] }
egui = "=0.31.1"
alacritty_terminal = "0.25"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "ico"] }
arboard = "3"
anyhow = "1"
ab_glyph = "0.2"
base64 = "0.22"
flate2 = "1"
memchr = "2"
resvg = "0.45"
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
