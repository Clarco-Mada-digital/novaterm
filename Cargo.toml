[package]
name = "novaterm"
version = "0.1.0"
edition = "2021"
description = "Terminal moderne pour Linux : onglets, splits, thèmes, transparence et fond d'image"
license = "MIT"

[dependencies]
eframe = { version = "=0.31.1", features = ["__screenshot"] }
egui = "=0.31.1"
alacritty_terminal = "0.25"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
arboard = "3"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true